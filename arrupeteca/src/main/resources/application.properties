spring.application.name=arrupeteca
spring.profiles.active=dev

# Configuración de Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/arrupeteca?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Configuración JWT (Secreto Base64 de al menos 256 bits)
jwt.secret=${JWT_SECRET:Y2xhdmUtc2VjcmV0YS1kZS1kZXNhcnJvbGxvLW1pbi0zMi1jYXJhY3RlcmVzLWFycnVwZXRlY2E=}
jwt.access-token-expiration=86400000
jwt.issuer=arrupeteca

