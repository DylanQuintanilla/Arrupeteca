plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'jacoco'
	id 'org.owasp.dependencycheck' version '12.1.0'
}

group = 'com.arrupeteca'
version = '0.0.1-SNAPSHOT'
description = 'Proyecto de inicio Arrupeteca'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- 1. CORE DE SPRING BOOT ---
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// --- 2. BASE DE DATOS ---
	runtimeOnly 'com.mysql:mysql-connector-j'

	// --- 3. DOCUMENTACIÓN Y HERRAMIENTAS DE DESARROLLO ---
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- 4. MAPEO DE OBJETOS (ORDEN CRÍTICO) ---
	// A) Lombok (Librería principal)
	compileOnly 'org.projectlombok:lombok'
	// B) MapStruct (Librería principal)
	implementation 'org.mapstruct:mapstruct:1.6.2'

	// C) Procesadores: El orden aquí abajo es vital
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

	// --- 5. PRUEBAS (TESTING) ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 1.0
			}
		}
	}
}

checkstyle {
	toolVersion = '10.21.2'
	configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
	ignoreFailures = false
	maxWarnings = 0
}

dependencyCheck {
	failBuildOnCVSS = 7.0
	format = 'HTML'
	if (System.getenv('NVD_API_KEY') == null) {
		skip = true
	}
}

compileJava {
	options.compilerArgs += [
			'-Amapstruct.defaultComponentModel=spring',
			'-Amapstruct.unmappedTargetPolicy=IGNORE'
	]
}
